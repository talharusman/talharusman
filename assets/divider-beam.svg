<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 24" width="100%" height="24" fill="none">
  <defs>
    <!-- Main Beam Gradient with Left Needle Highlight and Right Fade -->
    <linearGradient id="tr-beam-core" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F0EF" stop-opacity="1" />
      <stop offset="1.5%" stop-color="#5DE2CD" stop-opacity="1" />
      <stop offset="6%" stop-color="#20B99F" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#16A58F" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#16A58F" stop-opacity="0.65" />
      <stop offset="85%" stop-color="#16A58F" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#16A58F" stop-opacity="0" />
    </linearGradient>

    <!-- Outer Ambient Glow Gradient -->
    <linearGradient id="tr-beam-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20B99F" stop-opacity="0.9" />
      <stop offset="15%" stop-color="#16A58F" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#16A58F" stop-opacity="0.3" />
      <stop offset="90%" stop-color="#16A58F" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Moving Shimmer Pulse -->
    <linearGradient id="tr-beam-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20B99F" stop-opacity="0" />
      <stop offset="35%" stop-color="#20B99F" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#F1F0EF" stop-opacity="0.9">
        <animate attributeName="offset" values="0.05;0.95;0.05" dur="4.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="65%" stop-color="#20B99F" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#20B99F" stop-opacity="0" />
    </linearGradient>

    <!-- Gaussian Blur Filters for Soft Laser Glow -->
    <filter id="tr-glow-wide" x="-5%" y="-100%" width="110%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
    </filter>
    <filter id="tr-glow-tight" x="-5%" y="-100%" width="110%" height="300%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
    </filter>

    <style>
      @media (prefers-reduced-motion: reduce) {
        animate { display: none !important; }
      }
    </style>
  </defs>

  <!-- Layer 1: Ambient Wide Soft Glow -->
  <path d="M 22 12 L 32 9.5 L 896 11.2 L 896 12.8 L 32 14.5 Z" fill="url(#tr-beam-glow)" filter="url(#tr-glow-wide)" opacity="0.6" />

  <!-- Layer 2: Tight Core Glow -->
  <path d="M 22 12 L 32 10 L 896 11.4 L 896 12.6 L 32 14 Z" fill="url(#tr-beam-glow)" filter="url(#tr-glow-tight)" opacity="0.85" />

  <!-- Layer 3: Solid Precision Needle & Beam Body -->
  <path d="M 22 12 L 30 10.6 L 896 11.6 L 896 12.4 L 30 13.4 Z" fill="url(#tr-beam-core)" />

  <!-- Layer 4: Ultra-Crisp Center Luminescence Line -->
  <line x1="22" y1="12" x2="896" y2="12" stroke="url(#tr-beam-core)" stroke-width="1.2" stroke-linecap="round" />

  <!-- Layer 5: Traveling Subtle Laser Shimmer -->
  <line x1="26" y1="12" x2="880" y2="12" stroke="url(#tr-beam-shimmer)" stroke-width="1.6" stroke-linecap="round" opacity="0.75" />

  <!-- Layer 6: Needle Point Anchor Flare -->
  <circle cx="22" cy="12" r="1.8" fill="#F1F0EF" filter="url(#tr-glow-tight)" />
  <circle cx="22" cy="12" r="1" fill="#FFFFFF" />
</svg>

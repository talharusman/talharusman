<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 84" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tr-ft-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0B0B" />
      <stop offset="35%" stop-color="#111111" />
      <stop offset="50%" stop-color="#151515" />
      <stop offset="65%" stop-color="#111111" />
      <stop offset="100%" stop-color="#0B0B0B" />
    </linearGradient>

    <!-- Glowing Wave Gradient -->
    <linearGradient id="tr-ft-wave-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16A58F" stop-opacity="0" />
      <stop offset="35%" stop-color="#16A58F" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#20B99F" stop-opacity="0.9">
        <animate attributeName="offset" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="65%" stop-color="#16A58F" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#16A58F" stop-opacity="0" />
    </linearGradient>

    <clipPath id="tr-ft-clip">
      <rect x="0" y="0" width="920" height="84" rx="14" ry="14" />
    </clipPath>

    <style>
      .mono-ft { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace; }
      .sans-ft { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', Helvetica, Arial, sans-serif; }
      @media (prefers-reduced-motion: reduce) {
        animate, animateTransform { display: none !important; }
      }
    </style>
  </defs>

  <g clip-path="url(#tr-ft-clip)">
    <!-- Base Background -->
    <rect width="920" height="84" fill="url(#tr-ft-gradient)" />

    <!-- Subtle Wave Tracer Line -->
    <path d="M 0 42 Q 230 20 460 42 T 920 42" fill="none" stroke="url(#tr-ft-wave-teal)" stroke-width="1.4" stroke-linecap="round">
      <animate attributeName="d" 
        values="M 0 42 Q 230 20 460 42 T 920 42;
                M 0 42 Q 230 64 460 42 T 920 42;
                M 0 42 Q 230 20 460 42 T 920 42" 
        dur="7.5s" repeatCount="indefinite" />
    </path>

    <!-- Center Pulse Beacon -->
    <g transform="translate(460, 22)">
      <circle cx="0" cy="0" r="3" fill="#20B99F">
        <animate attributeName="r" values="2.5;4.5;2.5" dur="2.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="7" fill="none" stroke="#16A58F" stroke-width="0.8" opacity="0.4">
        <animate attributeName="r" values="4;10;4" dur="2.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.5;0;0.5" dur="2.5s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Footer Editorial Statement -->
    <text x="460" y="48" text-anchor="middle" fill="#F1F0EF" font-size="12" font-weight="600" letter-spacing="1.8" class="sans-ft">
      TALHA RUSMAN <tspan fill="#16A58F">•</tspan> ARTIFICIAL INTELLIGENCE &amp; FULL-STACK SYSTEMS
    </text>

    <!-- Sub-caption -->
    <text x="460" y="66" text-anchor="middle" fill="#858585" font-size="10.5" letter-spacing="1.2" class="mono-ft">
      FAST-NUCES '27 // KARACHI, PAKISTAN // OPEN FOR OPPORTUNITIES
    </text>

    <!-- Border -->
    <rect x="1" y="1" width="918" height="82" rx="13" ry="13" fill="none" stroke="#292929" stroke-width="1.2" />
  </g>
</svg>

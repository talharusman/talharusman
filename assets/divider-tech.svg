<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 28" width="100%" height="28" fill="none">
  <defs>
    <!-- Base Line Gradient -->
    <linearGradient id="tr-div2-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#292929" stop-opacity="0" />
      <stop offset="20%" stop-color="#292929" stop-opacity="0.6" />
      <stop offset="42%" stop-color="#16A58F" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#20B99F" stop-opacity="0.9" />
      <stop offset="58%" stop-color="#16A58F" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#292929" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#292929" stop-opacity="0" />
    </linearGradient>

    <!-- Animated Scanning Laser Beam -->
    <linearGradient id="tr-div2-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16A58F" stop-opacity="0" />
      <stop offset="35%" stop-color="#16A58F" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#F1F0EF" stop-opacity="1">
        <animate attributeName="offset" values="0.1;0.9;0.1" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="65%" stop-color="#16A58F" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#16A58F" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="tr-div2-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .mono-div { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
      @media (prefers-reduced-motion: reduce) {
        animate, animateTransform { display: none !important; }
      }
    </style>
  </defs>

  <!-- Left Track & Reticle Marks -->
  <line x1="40" y1="14" x2="400" y2="14" stroke="url(#tr-div2-grad)" stroke-width="1.2" />
  <line x1="180" y1="10" x2="180" y2="18" stroke="#292929" stroke-width="1" />
  <line x1="280" y1="11" x2="280" y2="17" stroke="#292929" stroke-width="1" />
  <circle cx="340" cy="14" r="1.5" fill="#16A58F" opacity="0.6" />

  <!-- Right Track & Reticle Marks -->
  <line x1="520" y1="14" x2="880" y2="14" stroke="url(#tr-div2-grad)" stroke-width="1.2" />
  <circle cx="580" cy="14" r="1.5" fill="#16A58F" opacity="0.6" />
  <line x1="640" y1="11" x2="640" y2="17" stroke="#292929" stroke-width="1" />
  <line x1="740" y1="10" x2="740" y2="18" stroke="#292929" stroke-width="1" />

  <!-- Animated Center Traverse Beam -->
  <line x1="120" y1="14" x2="800" y2="14" stroke="url(#tr-div2-pulse)" stroke-width="1.6" stroke-linecap="round" />

  <!-- Center Telemetry Geometry (Calipers & Hex/Diamond Node) -->
  <g transform="translate(460, 14)">
    <!-- Outer Caliper Brackets -->
    <path d="M -48 7 L -40 0 L -48 -7" stroke="#292929" stroke-width="1.2" fill="none" stroke-linecap="round" />
    <path d="M 48 7 L 40 0 L 48 -7" stroke="#292929" stroke-width="1.2" fill="none" stroke-linecap="round" />

    <!-- Inner Tick Points -->
    <circle cx="-24" cy="0" r="1.5" fill="#16A58F" />
    <circle cx="24" cy="0" r="1.5" fill="#16A58F" />
    <line x1="-16" y1="0" x2="-8" y2="0" stroke="#292929" stroke-width="1" />
    <line x1="8" y1="0" x2="16" y2="0" stroke="#292929" stroke-width="1" />

    <!-- Center Geometric Pill Hub -->
    <rect x="-7" y="-7" width="14" height="14" rx="3.5" transform="rotate(45)" fill="#111111" stroke="#292929" stroke-width="1.2" />
    <rect x="-4.5" y="-4.5" width="9" height="9" rx="2" transform="rotate(45)" fill="#151515" stroke="#16A58F" stroke-width="1" />

    <!-- Center Pulsing Core -->
    <circle cx="0" cy="0" r="2.2" fill="#20B99F" filter="url(#tr-div2-glow)">
      <animate attributeName="r" values="1.8;2.8;1.8" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tr-bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0B" />
      <stop offset="50%" stop-color="#111111" />
      <stop offset="100%" stop-color="#0B0B0B" />
    </linearGradient>

    <!-- Animated Ambient Teal Glow -->
    <radialGradient id="tr-glow-teal-1" cx="80%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#16A58F" stop-opacity="0.22">
        <animate attributeName="stop-opacity" values="0.14;0.26;0.14" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0B0B0B" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0B0B0B" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="tr-glow-teal-2" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#20B99F" stop-opacity="0.12">
        <animate attributeName="stop-opacity" values="0.08;0.18;0.08" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0B0B0B" stop-opacity="0" />
    </radialGradient>

    <!-- Animated Laser Traverse on Underline -->
    <linearGradient id="tr-laser-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#292929" stop-opacity="0.4" />
      <stop offset="25%" stop-color="#16A58F" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#20B99F" stop-opacity="1">
        <animate attributeName="offset" values="0.1;0.9;0.1" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#16A58F" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#292929" stop-opacity="0.4" />
    </linearGradient>

    <!-- Mathematical Wave Gradient -->
    <linearGradient id="tr-wave-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16A58F" stop-opacity="0" />
      <stop offset="30%" stop-color="#16A58F" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#20B99F" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#16A58F" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#16A58F" stop-opacity="0" />
    </linearGradient>

    <!-- Minimal Technical Grid Pattern -->
    <pattern id="tr-tech-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#292929" stroke-width="0.8" stroke-opacity="0.55" />
      <circle cx="0" cy="0" r="0.9" fill="#16A58F" fill-opacity="0.3" />
    </pattern>

    <!-- Card Clip Path -->
    <clipPath id="tr-card-clip">
      <rect x="0" y="0" width="920" height="380" rx="16" ry="16" />
    </clipPath>

    <!-- Glow Filter -->
    <filter id="tr-glow-node" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .mono-txt { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace; }
      .sans-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', Helvetica, Arial, sans-serif; }
      @media (prefers-reduced-motion: reduce) {
        animate, animateTransform { display: none !important; }
      }
    </style>
  </defs>

  <g clip-path="url(#tr-card-clip)">
    <!-- Base Background -->
    <rect width="920" height="380" fill="url(#tr-bg-gradient)" />

    <!-- Ambient Teal Glows -->
    <rect width="920" height="380" fill="url(#tr-glow-teal-1)" />
    <rect width="920" height="380" fill="url(#tr-glow-teal-2)" />

    <!-- Technical Grid -->
    <rect width="920" height="380" fill="url(#tr-tech-grid)" />

    <!-- Corner Accents (Precision Dark UI) -->
    <path d="M 24 38 L 24 24 L 38 24" stroke="#292929" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 896 38 L 896 24 L 882 24" stroke="#292929" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 24 342 L 24 356 L 38 356" stroke="#292929" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 896 342 L 896 356 L 882 356" stroke="#292929" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Restrained Orbital Geometry (Right Field) -->
    <g transform="translate(740, 190)">
      <!-- Outer Orbit -->
      <circle cx="0" cy="0" r="130" stroke="#292929" stroke-width="1" stroke-dasharray="4 8" fill="none">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="48s" repeatCount="indefinite" />
      </circle>
      <!-- Mid Orbit -->
      <circle cx="0" cy="0" r="95" stroke="#16A58F" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="10 16" fill="none">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite" />
      </circle>
      <!-- Inner Precision Ring -->
      <circle cx="0" cy="0" r="60" stroke="#292929" stroke-width="1" fill="none" />
      <circle cx="0" cy="0" r="28" stroke="#16A58F" stroke-width="1.5" stroke-opacity="0.4" fill="#111111" />

      <!-- Center Neural Node -->
      <circle cx="0" cy="0" r="7" fill="#20B99F" filter="url(#tr-glow-node)">
        <animate attributeName="r" values="6;8.5;6" dur="3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" />
      </circle>

      <!-- Revolving Satellite Node -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite" />
        <circle cx="95" cy="0" r="4" fill="#20B99F" filter="url(#tr-glow-node)" />
        <line x1="0" y1="0" x2="95" y2="0" stroke="#16A58F" stroke-width="0.7" stroke-opacity="0.3" stroke-dasharray="2 4" />
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="180" to="-180" dur="22s" repeatCount="indefinite" />
        <circle cx="60" cy="0" r="3" fill="#858585" />
        <circle cx="130" cy="0" r="2.5" fill="#F1F0EF" stroke="#16A58F" stroke-width="1" />
      </g>

      <!-- Precision Crosshairs -->
      <line x1="-140" y1="0" x2="-120" y2="0" stroke="#292929" stroke-width="1" />
      <line x1="120" y1="0" x2="140" y2="0" stroke="#292929" stroke-width="1" />
      <line x1="0" y1="-140" x2="0" y2="-120" stroke="#292929" stroke-width="1" />
      <line x1="0" y1="120" x2="0" y2="140" stroke="#292929" stroke-width="1" />
    </g>

    <!-- Animated Neural Sine Wave Tracer -->
    <path d="M 40 285 Q 180 245 320 285 T 600 285 T 880 285" fill="none" stroke="url(#tr-wave-teal)" stroke-width="1.8" stroke-linecap="round">
      <animate attributeName="d" 
        values="M 40 285 Q 180 245 320 285 T 600 285 T 880 285;
                M 40 285 Q 180 315 320 275 T 600 295 T 880 285;
                M 40 285 Q 180 245 320 285 T 600 285 T 880 285" 
        dur="9s" repeatCount="indefinite" />
    </path>

    <!-- Status Indicator Pill -->
    <g transform="translate(60, 52)">
      <rect x="0" y="0" width="315" height="30" rx="15" fill="#111111" stroke="#292929" stroke-width="1" />
      <!-- Pulsing Teal Dot -->
      <circle cx="16" cy="15" r="4.5" fill="#16A58F">
        <animate attributeName="r" values="3.5;5.5;3.5" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="16" cy="15" r="8" fill="none" stroke="#16A58F" stroke-width="1" opacity="0.3">
        <animate attributeName="r" values="5;12;5" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="19.5" fill="#F1F0EF" font-size="11.5" letter-spacing="1.2" class="mono-txt" font-weight="600">
        SYSTEM: ONLINE <tspan fill="#858585">//</tspan> BS AI @ FAST '27
      </text>
    </g>

    <!-- Main Editorial Name -->
    <g transform="translate(60, 145)">
      <text x="0" y="0" fill="#F1F0EF" font-size="48" font-weight="800" letter-spacing="2.5" class="sans-txt">
        TALHA RUSMAN
      </text>
    </g>

    <!-- Laser Underline / Horizon Line -->
    <g transform="translate(60, 160)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#292929" stroke-width="1.5" />
      <line x1="0" y1="0" x2="480" y2="0" stroke="url(#tr-laser-teal)" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="480" cy="0" r="2.5" fill="#16A58F" />
    </g>

    <!-- Subtitle / Positioning -->
    <g transform="translate(60, 200)">
      <text x="0" y="0" fill="#20B99F" font-size="16.5" font-weight="600" letter-spacing="1.1" class="sans-txt">
        AI/ML Engineer <tspan fill="#858585">|</tspan> Full-Stack Developer <tspan fill="#858585">|</tspan> LLM &amp; Computer Vision
      </text>
    </g>

    <!-- Editorial Tagline -->
    <g transform="translate(60, 234)">
      <text x="0" y="0" fill="#858585" font-size="14" font-weight="400" letter-spacing="0.3" class="sans-txt">
        Architecting production-grade machine learning pipelines, local LLM inference, and resilient web systems.
      </text>
    </g>

    <!-- Minimal Badges / Signature Capsules -->
    <g transform="translate(60, 292)">
      <!-- Capsule 1 -->
      <g transform="translate(0, 0)">
        <rect width="138" height="30" rx="6" fill="#111111" stroke="#292929" stroke-width="1" />
        <circle cx="16" cy="15" r="3" fill="#16A58F" />
        <text x="26" y="19" fill="#F1F0EF" font-size="11.5" font-weight="500" class="mono-txt">LoRA &amp; RAG</text>
      </g>
      <!-- Capsule 2 -->
      <g transform="translate(148, 0)">
        <rect width="168" height="30" rx="6" fill="#111111" stroke="#292929" stroke-width="1" />
        <circle cx="16" cy="15" r="3" fill="#16A58F" />
        <text x="26" y="19" fill="#F1F0EF" font-size="11.5" font-weight="500" class="mono-txt">ST-GCN &amp; Vision</text>
      </g>
      <!-- Capsule 3 -->
      <g transform="translate(326, 0)">
        <rect width="162" height="30" rx="6" fill="#111111" stroke="#292929" stroke-width="1" />
        <circle cx="16" cy="15" r="3" fill="#16A58F" />
        <text x="26" y="19" fill="#F1F0EF" font-size="11.5" font-weight="500" class="mono-txt">Next.js &amp; FastAPI</text>
      </g>
      <!-- Capsule 4 -->
      <g transform="translate(498, 0)">
        <rect width="138" height="30" rx="6" fill="#111111" stroke="#292929" stroke-width="1" />
        <circle cx="16" cy="15" r="3" fill="#16A58F" />
        <text x="26" y="19" fill="#F1F0EF" font-size="11.5" font-weight="500" class="mono-txt">FAST-NUCES '27</text>
      </g>
    </g>

    <!-- Inner Border Frame -->
    <rect x="1" y="1" width="918" height="378" rx="15" ry="15" fill="none" stroke="#292929" stroke-width="1.2" />
  </g>
</svg>
